spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:smart_trader_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  ai:
    openai:
      api-key: test-openai-key
  data:
    redis:
      host: localhost
      port: 6379

smart-trader:
  mode: PAPER
  live-trading-enabled: false
  deterministic-fallback-enabled: false
  security:
    issuer: smart-trader-test
    secret: test-secret-that-is-at-least-256-bits-long-for-hs512-algorithm
