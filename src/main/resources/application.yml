spring:
  application:
    name: smart-trader
  profiles:
    default: paper
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smart_trader}
    username: ${DB_USERNAME:smart_trader}
    password: ${DB_PASSWORD:smart_trader}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

logging:
  level:
    root: INFO
    com.smarttrader: INFO

smart-trader:
  mode: ${TRADING_MODE:PAPER}
  live-trading-enabled: ${LIVE_TRADING_ENABLED:false}
  deterministic-fallback-enabled: ${DETERMINISTIC_FALLBACK_ENABLED:false}
  security:
    issuer: ${JWT_ISSUER:smart-trader}
    secret: ${JWT_SECRET:change-me-in-production-use-256-bit-minimum}
